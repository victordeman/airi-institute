{% extends "base.html" %}
{% block title %}Login - AIRI Institute{% endblock %}

{% block content %}
<div class="min-h-screen pt-32 pb-20 px-6">
    <div class="container mx-auto">
        <div class="max-w-md mx-auto">
            <div class="glass-card rounded-3xl p-8 border border-white/10 shadow-2xl">
                <div class="text-center mb-8">
                    <div class="mb-6">
                        <span class="text-4xl font-bold text-primary tracking-tighter uppercase">AIRI Institute</span>
                    </div>
                    <h1 class="text-3xl font-display font-bold text-slate-900 dark:text-white">Welcome back to the Renaissance</h1>
                    <p class="text-slate-500 dark:text-slate-400 mt-2">Sign in to access your AIRI Institute profile</p>
                </div>

                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email or Username</label>
                        <input type="text" name="username" placeholder="Enter your credentials" required class="w-full bg-white/5 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 transition-colors">
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
                            <a href="#" class="text-xs text-indigo-600 hover:underline">Forgot password?</a>
                        </div>
                        <input type="password" name="password" placeholder="••••••••" required class="w-full bg-white/5 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 transition-colors">
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-500/20 transition-all active:scale-[0.98] mt-4">
                        Sign In
                    </button>

                    <div class="relative py-4">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-slate-200 dark:border-white/10"></div>
                        </div>
                        <div class="relative flex justify-center text-xs uppercase">
                            <span class="bg-white dark:bg-slate-900 px-2 text-slate-500">Or continue with</span>
                        </div>
                    </div>

                    <button type="button" class="w-full bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 hover:bg-slate-50 dark:hover:bg-white/10 text-slate-900 dark:text-white font-medium py-3 rounded-xl transition-all flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Continue with Google
                    </button>
                </form>

                <div id="login-status" class="mt-6 hidden"></div>

                <p class="text-center text-slate-500 text-sm mt-8">
                    Don't have an account? <a href="/register" class="text-indigo-600 font-bold hover:underline">Register</a>
                </p>

                <!-- Language Selector -->
                <div class="mt-8 pt-6 border-t border-slate-200 dark:border-white/10 flex justify-center gap-4">
                    <button onclick="switchLang('en')" class="text-xs font-bold text-slate-500 hover:text-indigo-600">EN</button>
                    <button onclick="switchLang('yo')" class="text-xs font-bold text-slate-500 hover:text-indigo-600">YO</button>
                    <button onclick="switchLang('sw')" class="text-xs font-bold text-slate-500 hover:text-indigo-600">SW</button>
                    <button onclick="switchLang('ig')" class="text-xs font-bold text-slate-500 hover:text-indigo-600">IG</button>
                    <button onclick="switchLang('ha')" class="text-xs font-bold text-slate-500 hover:text-indigo-600">HA</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);
    const status = document.getElementById('login-status');

    try {
        const response = await fetch('/auth/token', {
            method: 'POST',
            body: formData, // OAuth2PasswordRequestForm expects form data
        });

        const result = await response.json();
        status.classList.remove('hidden');
        if (response.ok) {
            localStorage.setItem('access_token', result.access_token);
            document.cookie = `access_token=${result.access_token}; path=/; max-age=28800; SameSite=Lax`;

            // Fetch user profile to determine role-based redirect
            const profileRes = await fetch('/auth/me', {
                headers: { 'Authorization': `Bearer ${result.access_token}` }
            });
            const user = await profileRes.json();

            status.className = 'text-center py-3 px-4 rounded-xl bg-emerald-600/20 text-emerald-400 border border-emerald-500/30';
            status.textContent = 'Login successful! Redirecting...';

            const roleRedirects = {
                'super_admin': '/dashboard/admin',
                'institute_director': '/dashboard/institute',
                'faculty': '/dashboard/faculty',
                'research_assistant': '/dashboard/research',
                'student': '/dashboard/student',
                'industry_partner': '/dashboard/partner',
                'guest': '/'
            };

            const target = roleRedirects[user.role] || '/';
            setTimeout(() => window.location.href = target, 1000);
        } else {
            status.className = 'text-center py-3 px-4 rounded-xl bg-red-600/20 text-red-400 border border-red-500/30';
            status.textContent = result.detail || 'Login failed';
        }
    } catch (error) {
        status.classList.remove('hidden');
        status.className = 'text-center py-3 px-4 rounded-xl bg-red-600/20 text-red-400 border border-red-500/30';
        status.textContent = 'Network error. Please try again.';
    }
});
</script>
{% endblock %}
